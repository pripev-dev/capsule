name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-baseline:
    name: repository-baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify specification baseline
        shell: bash
        run: |
          test -f AGENTS.md
          test -f README.md
          test -f privacy-allowlist.json
          test -f schemas/capsule.schema.json
          test -f schemas/preservation-manifest.schema.json
          test -f schemas/visual-fragment-manifest.schema.json
          test -f schemas/evidence-map.schema.json
          git diff --check "origin/${GITHUB_BASE_REF:-main}...HEAD"

      # The negative fixtures are the point. A rule nobody can break is not a
      # rule, so the suite asserts that each promised prohibition actually
      # rejects the document that breaks it.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Validate schemas and fixtures
        run: npm test

      # ---------------------------------------------------------------------
      # This repository is public, so the guard is mechanical rather than a
      # matter of remembering.
      #
      # It is the SAME command a person runs locally - `npm run check:privacy`,
      # Node and git only, no bash and no `grep -P`. That matters: the guard it
      # replaced was a pile of shell pipelines that could not be run on the
      # Windows development machine at all, so nobody ever ran it before
      # pushing and its first execution was always after publication.
      #
      # And this step is the SECOND line, not the first. A CI check on a public
      # branch is detection after the fact: when this job turns red the blob is
      # already on GitHub and already in its API, and removing it needs a
      # history rewrite rather than a commit. Prevention is running the command
      # before `git push`. See README.md, "Before you push".
      #
      # What it refuses, and what proves each: test/privacy.test.mjs builds a
      # real temporary repository per category and asserts the refusal.
      # ---------------------------------------------------------------------
      - name: Refuse family material
        run: npm run check:privacy
